<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>大山微信耍帅版</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        // App 容器会在 UserAgent 末尾追加 SimulatorApp 标识，命中即启用全屏布局
        if (/SimulatorApp/.test(navigator.userAgent)) {
            document.documentElement.classList.add('in-app');
        }
    </script>
</head>
<body>

<div style="display: flex; flex-direction: column; align-items: center;">
    <div class="phone">
        <!-- 1. 真实状态栏 -->
        <div class="status-bar">
            <span class="status-bar-time" id="displayTime" onclick="changeTime()">00:00</span>
            <div class="battery-area" onclick="changeBattery()">
                <div class="signal-bars">
                    <div class="signal-bar"></div>
                    <div class="signal-bar"></div>
                    <div class="signal-bar"></div>
                    <div class="signal-bar"></div>
                </div>
                <span class="network-type">5G</span>
                <div class="ios-battery-pill" id="batteryPill">
                    <div class="ios-battery-fill" id="batteryFill" style="width: 23%;"></div>
                    <span class="ios-battery-num" id="displayBattery">23</span>
                </div>
            </div>
        </div>

        <!-- 2. 导航栏 -->
        <div class="nav-bar">
            <div class="nav-left">
                <div class="back-arrow"></div>
            </div>
            <div class="nav-title" id="chatTitle" onclick="changeTitle()" title="点击修改聊天名字">282</div>
            <div class="nav-more">
                <div class="nav-more-dot"></div>
                <div class="nav-more-dot"></div>
                <div class="nav-more-dot"></div>
            </div>
        </div>

        <!-- 3. 聊天内容区域 -->
        <div class="chat-body" id="chatBody" onclick="hideActionMenu()">
            <!-- 单击气泡弹出的菜单 -->
            <div class="chat-action-menu" id="actionMenu">
                <ul>
                    <li onclick="deleteCurrentRow()">删除</li>
                </ul>
            </div>

            <div class="msg-row right" onclick="onRowClick(event, this)">
                <div class="avatar right-avatar" style="background-color: #2c2c2c;" onclick="triggerAvatarUpload('right')" title="点击更换我的头像">我</div>
                <div class="bubble-wrapper">
                    <div class="bubble">小丽</div>
                </div>
            </div>

            <div class="msg-row left" onclick="onRowClick(event, this)">
                <div class="avatar left-avatar" style="background-color: #507090;" onclick="triggerAvatarUpload('left')" title="点击更换对方头像">客</div>
                <div class="bubble-wrapper">
                    <div class="bubble">😳</div>
                </div>
            </div>
        </div>

        <!-- 表情包选择面板：微信经典表情由 JS 动态渲染，支持自定义添加 -->
        <div class="emoji-panel" id="emojiPanel">
            <div class="emoji-grid" id="emojiGrid">
                <div class="custom-emoji-add" onclick="triggerCustomEmojiUpload()" title="添加自定义表情包">➕</div>
            </div>
        </div>

        <!-- 4. 底部输入栏（左侧语音，右侧笑脸） -->

                <div class="panel-item" onclick="triggerCameraUpload()">
                    <div class="panel-icon-box">
                        <svg class="panel-icon-svg" viewBox="0 0 24 24"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
                    </div>
                    <span class="panel-label">拍摄</span>
                </div>
                <!-- 视频通话 -->
                <div class="panel-item" onclick="simulateVideoCall()">
                    <div class="panel-icon-box">
                        <svg class="panel-icon-svg" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                    </div>
                    <span class="panel-label">视频通话</span>
                </div>
                <!-- 位置 -->
                <div class="panel-item" onclick="sendLocation()">
                    <div class="panel-icon-box">
                        <svg class="panel-icon-svg" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    </div>
                    <span class="panel-label">位置</span>
                </div>
                <!-- 红包 -->
                <div class="panel-item" onclick="sendRedPacket()">
                    <div class="panel-icon-box">
                        <svg class="panel-icon-svg" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 4l-7 4-7-4V5l7 4 7-4v2z"/></svg>
                    </div>
                    <span class="panel-label">红包</span>
                </div>
                <!-- 礼物 -->
                <div class="panel-item" onclick="sendGift()">
                    <div class="panel-icon-box">
                        <svg class="panel-icon-svg" viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.1.89 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.11-.9-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4V8h5.08L7 10.83l1.41 1.41L12 8.66l3.59 3.58L17 10.83 14.92 8H20v11z"/></svg>
                    </div>
                    <span class="panel-label">礼物</span>
                </div>
                <!-- 转账 -->
                <div class="panel-item" onclick="sendTransfer()">
                    <div class="panel-icon-box">
                        <svg class="panel-icon-svg" viewBox="0 0 24 24"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
                    </div>
                    <span class="panel-label">转账</span>
                </div>
                <!-- 语音输入 -->
                <div class="panel-item" onclick="voiceInput()">
                    <div class="panel-icon-box">
                        <svg class="panel-icon-svg" viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
                    </div>
                    <span class="panel-label">语音输入</span>
                </div>
            </div>
            <div class="panel-dots">
                <div class="panel-dot active"></div>
                <div class="panel-dot"></div>
            </div>
        </div>

        <!-- HomeBar 横条 -->
        <div class="home-bar">
            <div class="home-bar-line"></div>
        </div>

        <!-- 自定义中文弹窗（放在最外层，不会被聊天内容覆盖） -->
        <div class="custom-dialog-mask" id="customDialogMask">
            <div class="custom-dialog">
                <div class="custom-dialog-title" id="customDialogTitle"></div>
                <input type="text" class="custom-dialog-input" id="customDialogInput" style="display:none;">
                <div class="custom-dialog-buttons">
                    <button class="custom-dialog-btn" id="customDialogCancelBtn"></button>
                    <button class="custom-dialog-btn primary" id="customDialogOkBtn"></button>
                </div>
            </div>
        </div>

        <!-- 点击聊天时间弹出的操作弹窗 -->
        <div class="custom-dialog-mask" id="timeDialogMask">
            <div class="custom-dialog">
                <div class="custom-dialog-title" id="timeDialogTitle"></div>
                <div class="custom-dialog-buttons">
                    <button class="custom-dialog-btn" onclick="closeTimeDialog()">取消</button>
                    <button class="custom-dialog-btn" onclick="deleteSelectedTime()">删除时间</button>
                    <button class="custom-dialog-btn primary" onclick="editSelectedTime()">编辑时间</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部控制面板 -->
    <div class="controls">
        <div class="control-row">
            <span><b>发送身份：</b></span>
            <div>
                <button class="btn" id="roleBtnRight" onclick="setRole('right')">我 (右侧)</button>
                <button class="btn btn-secondary" id="roleBtnLeft" onclick="setRole('left')">对方 (左侧)</button>
            </div>
        </div>
        <div class="control-row">
            <button class="btn" onclick="insertChatTime()">插入聊天时间</button>
            <button class="btn" onclick="changeTime()">手动改时间</button>
            <button class="btn" onclick="changeBattery()">修改电量</button>
            <button class="btn btn-danger" onclick="clearAll()">清空屏幕</button>
        </div>
        <div style="font-size: 11px; color: #888; text-align: center; margin-top: 4px;">
            提示：单击任意聊天消息可弹出删除按钮
        </div>
    </div>
</div>

<input type="file" id="fileInput" accept="image/*">
<input type="file" id="cameraInput" accept="image/*" capture="environment">
<input type="file" id="avatarFileInput" accept="image/*">
<input type="file" id="customEmojiInput" accept="image/*">


<script src="js/emojis.js"></script>
<script src="js/main.js"></script>

</body>
</html>
